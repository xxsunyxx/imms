[project]
name = "imms"
version = "0.1.0"
description = "Assemble a playable murder-mystery session from a user-provided script"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
imms = "imms.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imms"]
